<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario della tavola</title>
<style>
:root{--bg:#f4f1ee;--card:#fbfaf8;--ink:#1c1917;--mute:#78716c;--acc:#a8342a;--accsoft:#ecd5d1;--line:#e3ddd7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1816;--card:#292524;--ink:#f3eee9;--mute:#a39a92;--acc:#d2574b;--accsoft:#4a2a26;--line:#403a36}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 110px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1,h2,h3.s{font-family:"Playfair Display",Georgia,serif}
h1{font-size:34px;line-height:1.05;margin:0;font-weight:800}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:9px 16px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
input,select,textarea{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit}
textarea{resize:vertical;min-height:84px}
.search{margin:20px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px inherit;font-family:inherit;padding:9px 16px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:19px;margin:26px 0 10px;color:var(--mute);font-weight:700}
.meal{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font-family:inherit}
.date{text-align:center;min-width:44px;padding-right:16px;border-right:1px solid var(--line)}
.date b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:30px;line-height:1}
.date span{font-size:13px;color:var(--mute);text-transform:capitalize}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{background:var(--accsoft);color:var(--acc);font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.title{font-weight:600;font-size:18px}
.meta{color:var(--mute);font-size:15px;margin-top:5px}
.thumbw{position:relative;margin-left:auto;flex:none}
.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;display:block}
.thumbw em{position:absolute;right:-6px;top:-6px;background:var(--acc);color:#fff;font-size:12px;font-style:normal;font-weight:600;border-radius:99px;padding:2px 7px}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:15px 22px;font:600 16px inherit;font-family:inherit;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;background:var(--bg);color:var(--ink);width:100%;max-width:560px;height:100%;max-height:100%;margin:0 auto;padding:0;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{padding:calc(18px + env(safe-area-inset-top,0px)) 18px 30px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:28px}
.x{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
label{display:block;font:600 14px inherit;font-family:inherit;margin:18px 0 7px}
hr{border:0;border-top:1px solid var(--line);margin:24px 0 4px}
h3.s{font-size:22px;margin:16px 0 0}
.sel,.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sel span{background:var(--accsoft);color:var(--acc);padding:7px 8px 7px 14px;border-radius:99px;font-weight:600;font-size:15px}
.sel span button{border:0;background:none;color:var(--acc);font-size:16px;cursor:pointer;padding:0 4px}
.sug button{border:1px dashed var(--mute);background:none;color:var(--ink);padding:8px 14px;border-radius:99px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.prev div{position:relative}
.prev img{width:76px;height:76px;object-fit:cover;border-radius:12px;display:block}
.prev button{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.btns{display:flex;gap:10px;margin-top:26px}
.btns button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px inherit;font-family:inherit;cursor:pointer}
.btns .go{background:var(--acc);color:#fff;border-color:var(--acc)}
.btns .del{color:var(--acc)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.stat h3{margin:0 0 12px;font-size:15px;color:var(--mute);font-weight:600}
.big{font-family:"Playfair Display",Georgia,serif;font-size:42px;font-weight:800}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.bar i{display:block;height:10px;background:var(--acc);border-radius:99px;min-width:6px}
.bar span:first-child{width:92px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Diario della tavola</h1><div class="sub" id="count"></div></div>
    <div class="seg"><button class="on" id="tabD">Diario</button><button id="tabN">Numeri</button></div>
  </header>
  <div id="viewD">
    <input class="search" id="q" type="search" placeholder="Cerca persone, piatti, luoghi...">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </div>
  <div id="viewN" hidden style="margin-top:22px"></div>
</div>
<button class="fab" id="add">+ Nuovo pasto</button>

<dialog id="dlg"><div class="sheet">
  <div class="top"><h1 id="dTitle">Nuovo pasto</h1><button class="x" id="cancel" aria-label="Chiudi">✕</button></div>
  <label>Data</label><input type="date" id="fDate">
  <label>Tipo di pasto</label><select id="fType"></select>
  <label>Occasione</label><input id="fTitle" placeholder="Compleanno, anniversario, cena tra amici...">
  <label>Luogo</label><input id="fPlace" placeholder="A casa, ristorante, da amici...">
  <label>Partecipanti</label><input id="fPer" placeholder="Scrivi un nome e premi Invio" enterkeyhint="done">
  <div class="sel" id="selP"></div><div class="sug" id="sugP"></div>
  <hr><h3 class="s">Menù</h3>
  <div id="menuF"></div>
  <label>Foto dei piatti</label><input type="file" id="fFile" accept="image/*" multiple><div class="prev" id="fPrev"></div>
  <label>Note</label><textarea id="fNotes" rows="2"></textarea>
  <div class="btns"><button class="del" id="del" hidden>Elimina</button><button class="go" id="save">Salva</button></div>
</div></dialog>

<script>
const TYPES=["Colazione","Pranzo","Aperitivo","Cena"];
const COURSES=[["antipasti","Antipasti"],["primi","Primi"],["secondi","Secondi"],["contorni","Contorni"],["dolci","Dolci"],["bevande","Bevande e vini"]];
const MESI=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
const KEY="diario-tavola";
let meals=[],filter="Tutti",editId=null,people=[],photos=[];
try{meals=JSON.parse(localStorage.getItem(KEY)||"null")||[]}catch(e){meals=[]}
if(!meals.length)meals=[{id:1,date:"2026-11-20",type:"Pranzo",title:"",people:["Claudio","Cristina"],place:"",menu:{},notes:"",photos:[]}];
meals=meals.map(m=>({...m,title:m.title||"",menu:m.menu||(m.dishes?{secondi:m.dishes}:{}),people:m.people||[],photos:m.photos||[]}));
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(meals))}catch(e){alert("Spazio pieno: elimina qualche foto e riprova.")}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const menuText=m=>Object.values(m.menu).join(" ");
const firstDishes=m=>COURSES.map(([k])=>m.menu[k]).filter(Boolean).join(" · ");
$("fType").innerHTML=TYPES.map(t=>`<option>${t}</option>`).join("");
$("menuF").innerHTML=COURSES.map(([k,l])=>`<label>${l}</label><textarea id="m_${k}"></textarea>`).join("");

function renderChips(){
  $("chips").innerHTML=["Tutti",...TYPES].map(t=>`<button class="chip ${t===filter?"on":""}" data-t="${t}">${t}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.t;renderChips();renderList()});
}
function renderList(){
  const q=$("q").value.toLowerCase();
  const items=meals.filter(m=>(filter==="Tutti"||m.type===filter)&&(!q||[m.people.join(" "),menuText(m),m.place,m.notes,m.title,m.type].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
  $("count").textContent=meals.length===1?"1 pasto registrato":meals.length+" pasti registrati";
  if(!items.length){$("list").innerHTML='<div class="empty">Nessun pasto trovato. Tocca “Nuovo pasto” per aggiungerne uno.</div>';return}
  let out="",cur="";
  items.forEach(m=>{
    const d=new Date(m.date+"T12:00:00"),h=MESI[d.getMonth()]+" "+d.getFullYear();
    if(h!==cur){out+=`<h2>${h}</h2>`;cur=h}
    const meta=[m.people.length?"👥 "+m.people.join(", "):"",m.place?"📍 "+m.place:"",firstDishes(m)?"🍽 "+firstDishes(m):""].filter(Boolean).map(esc).join("<br>");
    const ph=m.photos.length?`<div class="thumbw"><img class="thumb" src="${m.photos[0]}" alt="">${m.photos.length>1?`<em>+${m.photos.length-1}</em>`:""}</div>`:"";
    out+=`<button class="meal" data-id="${m.id}"><div class="date"><b>${d.getDate()}</b><span>${GIORNI[d.getDay()]}</span></div><div style="min-width:0"><div class="row1"><span class="tag">${m.type}</span><span class="title">${esc(m.title||m.type)}</span></div><div class="meta">${meta||"Nessun dettaglio"}</div></div>${ph}</button>`;
  });
  $("list").innerHTML=out;
  $("list").querySelectorAll(".meal").forEach(b=>b.onclick=()=>openDlg(+b.dataset.id));
}
function renderNumbers(){
  const cnt=a=>{const o={};a.forEach(x=>o[x]=(o[x]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  const bars=e=>{const mx=e.length?e[0][1]:1;return e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*55}%"></i><span>${v}</span></div>`).join("")||'<div class="meta">Ancora nessun dato.</div>'};
  $("viewN").innerHTML=`<div class="stat"><h3>Pasti registrati</h3><div class="big">${meals.length}</div></div>
  <div class="stat"><h3>Per tipo</h3>${bars(cnt(meals.map(m=>m.type)))}</div>
  <div class="stat"><h3>Con chi mangi di più</h3>${bars(cnt(meals.flatMap(m=>m.people)))}</div>
  <div class="stat"><h3>Luoghi preferiti</h3>${bars(cnt(meals.map(m=>m.place).filter(Boolean)))}</div>`;
}
function renderPeople(){
  $("selP").innerHTML=people.map((p,i)=>`<span>${esc(p)}<button type="button" data-i="${i}" aria-label="Rimuovi">✕</button></span>`).join("");
  $("selP").querySelectorAll("button").forEach(b=>b.onclick=()=>{people.splice(+b.dataset.i,1);renderPeople()});
  const known=[...new Set(meals.flatMap(m=>m.people))].filter(p=>!people.includes(p));
  $("sugP").innerHTML=known.map(p=>`<button type="button" data-p="${esc(p)}">+ ${esc(p)}</button>`).join("");
  $("sugP").querySelectorAll("button").forEach(b=>b.onclick=()=>{people.push(b.dataset.p);renderPeople()});
}
function addPerson(){const v=$("fPer").value.replace(/,/g,"").trim();if(v&&!people.includes(v))people.push(v);$("fPer").value="";renderPeople()}
$("fPer").onkeydown=e=>{if(e.key==="Enter"||e.key===","){e.preventDefault();addPerson()}};
$("fPer").onblur=addPerson;
function renderPrev(){
  $("fPrev").innerHTML=photos.map((p,i)=>`<div><img src="${p}" alt="Foto ${i+1}"><button type="button" data-i="${i}" aria-label="Rimuovi foto">×</button></div>`).join("");
  $("fPrev").querySelectorAll("button").forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.i,1);renderPrev()});
}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
$("fFile").onchange=async e=>{for(const f of e.target.files){const d=await shrink(f);if(d&&photos.length<6)photos.push(d)}e.target.value="";renderPrev()};
function openDlg(id){
  editId=id;const m=meals.find(x=>x.id===id);
  $("dTitle").textContent=m?"Modifica pasto":"Nuovo pasto";
  $("fDate").value=m?m.date:new Date().toISOString().slice(0,10);
  $("fType").value=m?m.type:"Pranzo";
  $("fTitle").value=m?m.title:"";$("fPlace").value=m?m.place:"";$("fNotes").value=m?m.notes:"";
  COURSES.forEach(([k])=>$("m_"+k).value=m?(m.menu[k]||""):"");
  people=m?[...m.people]:[];photos=m?[...m.photos]:[];
  $("fPer").value="";renderPeople();renderPrev();
  $("del").hidden=!m;$("dlg").showModal();$("dlg").scrollTop=0;
}
$("add").onclick=()=>openDlg(null);
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=()=>{
  addPerson();if(!$("fDate").value)return;
  const menu={};COURSES.forEach(([k])=>{const v=$("m_"+k).value.trim();if(v)menu[k]=v});
  const m={id:editId||Date.now(),date:$("fDate").value,type:$("fType").value,title:$("fTitle").value.trim(),place:$("fPlace").value.trim(),people:[...people],menu,notes:$("fNotes").value.trim(),photos:[...photos]};
  meals=editId?meals.map(x=>x.id===editId?m:x):[...meals,m];
  save();$("dlg").close();renderList();renderNumbers();
};
$("del").onclick=()=>{if(!confirm("Eliminare questo pasto?"))return;meals=meals.filter(x=>x.id!==editId);save();$("dlg").close();renderList();renderNumbers()};
$("q").oninput=renderList;
$("tabD").onclick=()=>{$("tabD").classList.add("on");$("tabN").classList.remove("on");$("viewD").hidden=false;$("viewN").hidden=true;$("add").hidden=false};
$("tabN").onclick=()=>{$("tabN").classList.add("on");$("tabD").classList.remove("on");$("viewD").hidden=true;$("viewN").hidden=false;$("add").hidden=true;renderNumbers()};
renderChips();renderList();
</script>
</body>
</html>
